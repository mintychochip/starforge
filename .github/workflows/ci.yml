# CI: format, lints, tests on SQLite and Postgres 17, and browser tests.
# CI deliberately runs the full suite on both engines. The local gate
# (scripts/check.sh) uses nextest and a Postgres subset for speed.
name: ci

"on":
  push:
    branches: [next, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Install pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-sqlite:
    name: test (sqlite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Test on SQLite
        run: cargo test --workspace

  test-postgres:
    name: test (postgres 17)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: starforge
        options: >-
          --shm-size=1g
          --health-cmd="pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Test on Postgres
        env:
          STARFORGE_TEST_PG_URL: postgres://postgres:starforge@127.0.0.1:5432/postgres
        run: cargo test --workspace

  docs:
    name: technical docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Check technical documents
        run: python3 scripts/ste_check.py --strict
      - name: Test the documentation checker
        run: python3 -m unittest discover -s scripts/tests

  browser:
    name: browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Install pinned toolchain
        run: rustup show
      - name: Install Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Install Python compression libraries
        run: pip install zstandard==0.25.0 blake3==1.0.11
      - name: Install Chromium and its system libraries
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser tests
        run: scripts/browser-tests.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Install pinned toolchain
        run: rustup show
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  sandbox-e2e:
    name: real sandbox e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Install pinned toolchain
        run: rustup show
      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m pip install --user ziglang==0.13.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
      - name: Build static artifacts
        run: scripts/build-release.sh
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Run the real sandbox e2e
        run: STARFORGE_TEST_SANDBOX=1 scripts/ci-e2e.sh
