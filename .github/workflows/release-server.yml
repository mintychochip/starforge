# Build the server tarballs after the cargo-dist release workflow finishes.
# cargo-dist publishes the CLI; this workflow adds the static server, CLI,
# runner, and sandboxd tarballs plus SHA-256 sums to the same release.
name: Release server

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  server:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install pinned toolchain
        run: rustup show
      - name: Install zig and cargo-zigbuild
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          # The ziglang wheel ships `ziglang/zig` with no console script, so
          # pip --user installs no ~/.local/bin/zig. Shim it through the
          # package's own entry point.
          python3 -m pip install --user ziglang==0.13.0
          install -d "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zig" version
          cargo install cargo-zigbuild --locked
      - name: Build static tarballs
        run: scripts/build-release.sh
      - name: Upload server artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: target/release-artifacts/*
          fail_on_unmatched_files: true
