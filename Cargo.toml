[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-pre.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
async-compression = { version = "0.4.52", features = ["tokio", "gzip"] }
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "form"] }
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
comrak = "0.59.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
gix = "0.90.0"
hex = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "file-transport", "hostname", "ring", "rustls-platform-verifier", "smtp-transport", "tokio1", "tokio1-rustls"] }
percent-encoding = "2.3.2"
proptest = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json", "form"] }
ring = "0.17.14"
rusqlite = { version = "0.37", features = ["bundled"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
starforge-capture = { path = "crates/starforge-capture", version = "0.1.0-pre.1" }
starforge-cli = { path = "crates/starforge-cli", version = "0.1.0-pre.1" }
starforge-format = { path = "crates/starforge-format", version = "0.1.0-pre.1" }
starforge-redact = { path = "crates/starforge-redact", version = "0.1.0-pre.1" }
starforge-runner = { path = "crates/starforge-runner", version = "0.1.0-pre.1" }
subtle = "2.6.1"
tantivy = "0.27.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
ulid = { version = "1", features = ["serde"] }
url = "2.5.8"
utoipa = "6.0.0"
zstd = "0.13"
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Third-party crates build without debug info in dev and test builds: ~90
# integration-test binaries otherwise carry hundreds of MB of dependency
# debug info each. Workspace crates keep full debug info.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
