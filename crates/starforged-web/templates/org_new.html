{% extends "base.html" %}
{% block title %}New organization · Starforge{% endblock %}
{% block content %}
<h1>New organization</h1>
{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
<form method="post" action="/orgs/new" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>Handle <input name="handle" required maxlength="39" value="{{ handle }}"></label>
  <label>Display name <input name="display_name" maxlength="100" value="{{ display_name }}"></label>
  <label>Description <input name="description" maxlength="350" value="{{ description }}"></label>
  <button type="submit">Create organization</button>
</form>
{% endblock %}
