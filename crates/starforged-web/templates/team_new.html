{% extends "base.html" %}
{% block title %}New team · {{ handle }}{% endblock %}
{% block content %}
<h1><a href="/{{ handle }}">{{ handle }}</a> / New team</h1>
{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
<form method="post" action="/{{ handle }}/teams/new" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>Name <input name="name" required maxlength="64" value="{{ name }}"></label>
  <label>Description <input name="description" maxlength="350" value="{{ description }}"></label>
  <label>Permission <select name="permission">{% for p in permission_choices %}<option value="{{ p }}">{{ p }}</option>{% endfor %}</select></label>
  <label class="check"><input type="checkbox" name="all_repos" value="on" checked> Grant on all repositories of the organization</label>
  <button type="submit">Create team</button>
</form>
{% endblock %}
