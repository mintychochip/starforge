[package]
name = "starforge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = true
description = "Command-line interface for Starforge: session capture, Trails, and git remotes"
# cargo-dist's GitHub CI support requires a repository URL on the only
# distributed package; the other three publishable crates carry none.
repository = "https://github.com/starforge/starforge"
readme = "../../README.md"
keywords = ["starforge", "git", "forge", "cli", "agent-sessions"]
categories = ["command-line-utilities"]
authors = ["Starforge contributors"]

# Stable WiX GUIDs for the cargo-dist MSI installer. dist regenerates
# these if they are missing; keep them fixed so upgrades are stable.
[package.metadata.wix]
upgrade-guid = "EFAE5F1B-1C00-4CC9-A5FB-9BA24FBE7DF1"
path-guid = "5D6A6181-B821-4584-A6ED-CA6650E1D013"
license = false
eula = false

[[bin]]
name = "starforge"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
starforge-capture.workspace = true
starforge-format.workspace = true
starforge-redact.workspace = true
starforge-runner.workspace = true
starforge-sandbox-protocol = { path = "../starforge-sandbox-protocol", version = "0.1.0-rc.1" }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio.workspace = true
url.workspace = true
