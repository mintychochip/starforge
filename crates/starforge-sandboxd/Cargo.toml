[package]
name = "starforge-sandboxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = true
description = "Local sandbox provider daemon: Unix-socket HTTP control plane over rootless podman (plan M6b B2)"
readme = "../../README.md"
keywords = ["starforge", "sandbox", "daemon"]
categories = ["command-line-utilities"]

[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
nix = { version = "0.31", features = ["process", "socket", "user"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
starforge-sandbox-protocol = { path = "../starforge-sandbox-protocol", version = "0.1.0" }
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = "0.26"
tracing.workspace = true

[dev-dependencies]
tower = "0.5"
